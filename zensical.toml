[project]
site_name = "Invariant Runtime"
site_description = "Policy-aware plugin runtime for Python."
site_author = "kymuco"
site_url = "https://kymuco.github.io/invariant-runtime/"
repo_url = "https://github.com/kymuco/invariant-runtime"
repo_name = "kymuco/invariant-runtime"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
watch = [
  "SECURITY.md",
  "CAPABILITIES.md",
]
copyright = "Invariant Runtime · Apache-2.0"
extra_css = [
  "stylesheets/invariant.css",
]
nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = [
    { "Runtime model" = "concepts/runtime-model.md" },
  ] },
  { "Guides" = [
    { "Plugin authoring" = "guides/plugin-authoring.md" },
    { "Dependencies and capabilities" = "guides/dependencies-and-capabilities.md" },
  ] },
  { "Reference" = [
    { "Public API" = "reference/public-api.md" },
    { "Manifest v1" = "reference/manifest-v1.md" },
    { "Capabilities" = "reference/capabilities.md" },
  ] },
  { "Security" = "security.md" },
  { "Project" = [
    { "Status and limitations" = "project/status.md" },
    { "Contributing" = "project/contributing.md" },
    { "Core architecture" = "core.md" },
    { "Documentation standard" = "STYLE.md" },
  ] },
]

[project.theme]
variant = "modern"
font = false
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.tooltips",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

# Keep the extension set explicit. Once markdown_extensions is configured,
# Zensical's implicit defaults no longer apply, so code/diagram support must
# be declared here to keep rendered documentation reproducible.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
zensical.extensions.macros.module_name = "docs_macros"
zensical.extensions.macros.on_error_fail = true
zensical.extensions.macros.on_undefined = "strict"
