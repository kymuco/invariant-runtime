name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: core / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependency
        run: python -m pip install -e ".[test]"

      - name: Run core suite
        run: python -m pytest -q tests/core

  package:
    name: package smoke / py3.11
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Install wheel without dependencies
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl

      - name: Smoke import installed wheel
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -c "from invariant.spec.versioning import Version, canon_version_key; from invariant.catalog.registry import PluginRegistry; assert Version('1.0rc1') < Version('1.0'); assert canon_version_key('1.2') == '1.2.0'; print('INVARIANT_WHEEL_OK')"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/tools/verify_installed_alpha_candidate.py"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/examples/data_importers/run.py"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/examples/data_importers/run.py" --plugin-dir "$GITHUB_WORKSPACE/examples/data_importers/addons" "$GITHUB_WORKSPACE/examples/data_importers/samples/orders.tsv"
      - name: Verify exact package source revision
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "INVARIANT_ALPHA_SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Record and verify distribution SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Upload verified alpha distributions
        uses: actions/upload-artifact@v4
        with:
          name: invariant-runtime-0.1.2a1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
