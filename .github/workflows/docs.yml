name: Documentation

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SUPPORT.md"
      - "CAPABILITIES.md"
      - "SECURITY.md"
      - "docs/**"
      - "zensical.toml"
      - "docs_macros.py"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: docs / strict site build / py3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional documentation dependencies
        run: python -m pip install ".[docs]"
      - name: Check rendered site
        run: zensical build --clean --strict
